[package]
name = "braincraft"
version = "0.1.0"
description = "An infinite whiteboard for brainstorming"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
edition = "2024"

[dependencies]
eframe = { version = "0.36", features = ["glow"] }
egui = { version = "0.36", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
